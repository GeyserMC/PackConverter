name: Deep Validation

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * *"

concurrency:
  group: deep-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Repository integrity
        run: bash scripts/ci/validate-repository.sh

      - name: Resource tree integrity
        run: bash scripts/ci/validate-resources.sh

      - name: Gradle wrapper validation
        run: ./gradlew --version

      - name: Converter regression tests
        run: ./gradlew :converter:test --no-daemon --stacktrace

      - name: Full verification
        run: ./gradlew check --no-daemon --stacktrace

      - name: Build reproducibility check
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew clean build --no-daemon --stacktrace
          test -s bootstrap/build/libs/Thunder.jar
          sha256sum bootstrap/build/libs/Thunder.jar | tee build/deep-validation-artifact.sha256

      - name: Upload deep diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deep-validation-${{ github.run_id }}
          path: |
            build/**
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 14
