name: Build

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/*.yml'
      - '.github/actions/pullrequest.yml'
      - '.idea/copyright/*.xml'
      - '.gitignore'
      - 'LICENSE'
      - 'README.md'

# Keep every ref isolated and queue newer runs instead of cancelling work already in progress.
# This is important for scheduled unattended builds: a later trigger must not kill the build
# that is currently doing the actual Gradle validation.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        run: ./gradlew --version

      - name: Build and test
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Verify release artifact
        run: |
          test -f bootstrap/build/libs/Thunder.jar
          test -s bootstrap/build/libs/Thunder.jar
          echo "Artifact size: $(du -h bootstrap/build/libs/Thunder.jar | cut -f1)"

      - name: Archive artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('bootstrap/build/libs/Thunder.jar') != ''
        with:
          name: Thunder-${{ github.sha }}
          path: bootstrap/build/libs/Thunder.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-diagnostics-${{ github.run_id }}
          path: |
            build/reports/**
            **/build/test-results/**
            **/build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

      - name: Upstream-only release metadata
        if: ${{ success() && github.repository == 'GeyserMC/PackConverter' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/previous-release@master
        id: release-info
        with:
          data: ${{ vars.RELEASEACTION_PREVRELEASE }}

      - name: Publish to Maven Repository
        if: ${{ success() && github.repository == 'GeyserMC/PackConverter' && github.ref_name == 'master' }}
        run: ./gradlew publish
        env:
          BUILD_NUMBER: ${{ steps.release-info.outputs.curentRelease }}
          ORG_GRADLE_PROJECT_geysermcUsername: ${{ vars.DEPLOY_USER }}
          ORG_GRADLE_PROJECT_geysermcPassword: ${{ secrets.DEPLOY_PASS }}

      - name: Get Version
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/PackConverter' }}
        id: get-version
        run: |
          version=$(grep -oE '^version=[0-9.]+([A-Za-z0-9.-]*)?' gradle.properties | cut -d= -f2)
          echo "VERSION=${version}" >> "$GITHUB_OUTPUT"

      - name: Get Release Metadata
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/PackConverter' }}
        id: metadata
        uses: GeyserMC/actions/release@master
        with:
          appID: ${{ secrets.RELEASE_APP_ID }}
          appPrivateKey: ${{ secrets.RELEASE_APP_PK }}
          files: |
            thunder:bootstrap/build/libs/Thunder.jar
          releaseEnabled: false
          saveMetadata: true
          releaseProject: 'thunder'
          releaseVersion: ${{ steps.get-version.outputs.VERSION }}

      - name: Publish to Downloads API
        if: ${{ success() && github.repository == 'GeyserMC/PackConverter' && github.ref_name == 'master' }}
        uses: GeyserMC/actions/upload-release@master
        with:
          username: ${{ vars.DOWNLOADS_USERNAME }}
          privateKey: ${{ secrets.DOWNLOADS_PRIVATE_KEY }}
          host: ${{ secrets.DOWNLOADS_SERVER_IP }}
          files: |
            bootstrap/build/libs/Thunder.jar
          changelog: ${{ steps.metadata.outputs.body }}

      - name: Notify Discord
        if: ${{ (success() || failure()) && github.repository == 'GeyserMC/PackConverter' }}
        uses: GeyserMC/actions/notify-discord@master
        with:
          discordWebhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          body: ${{ steps.metadata.outputs.body }}
          includeDownloads: ${{ github.ref_name == 'master' }}
